[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vosk-errs"
version = "0.1.0"
description = "Word error rate computation via Levenshtein alignment"
requires-python = ">=3.8"

[project.scripts]
vosk-errs = "vosk_errs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
